name: Initialize Inleed autodeploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize release layout and restricted deploy key
        env:
          SOCIALEN_BOOTSTRAP_SSH_KEY: ${{ secrets.SOCIALEN_BOOTSTRAP_SSH_KEY }}
          SOCIALEN_KNOWN_HOSTS: ${{ secrets.SOCIALEN_KNOWN_HOSTS }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          assert os.environ['SOCIALEN_BOOTSTRAP_SSH_KEY'].strip(), 'A temporary bootstrap SSH key is required'
          with tempfile.TemporaryDirectory(prefix='socialen-bootstrap-', dir=os.environ['RUNNER_TEMP']) as directory:
              stage = Path(directory)
              key = stage / 'key'
              known = stage / 'known_hosts'
              key.write_text(os.environ['SOCIALEN_BOOTSTRAP_SSH_KEY'] + '\n')
              known.write_text(os.environ['SOCIALEN_KNOWN_HOSTS'] + '\n')
              key.chmod(0o600)
              known.chmod(0o600)
              archive = stage / 'bootstrap.tar.gz'
              subprocess.run(['tar', '-czf', str(archive), 'deploy'], check=True)
              remote = '''set -eu
          setup_dir=$(mktemp -d /home/rondit/tmp/socialen-bootstrap.XXXXXXXX)
          trap 'rm -rf -- "$setup_dir"' EXIT
          tar -xzf - -C "$setup_dir"
          bash "$setup_dir/deploy/bootstrap-inleed.sh"
          '''
              with archive.open('rb') as incoming:
                  subprocess.run(['ssh', '-T', '-4', '-p', '2020', '-i', str(key),
                      '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=yes',
                      '-o', 'UserKnownHostsFile=' + str(known), '-o', 'ConnectTimeout=15',
                      '-o', 'ServerAliveInterval=15', '-o', 'ServerAliveCountMax=3',
                      'rondit@prime3.inleed.net', remote], stdin=incoming, check=True)
